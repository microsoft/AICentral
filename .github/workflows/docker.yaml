name: PublishDocker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish-docker-container:
    runs-on: ubuntu-latest
    permissions: 
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@8d68520cde93ca9226ee0e09870caaca033d2cd2 # v1.1.1
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@8d68520cde93ca9226ee0e09870caaca033d2cd2 # v1.1.1
        with:
          useConfigFile: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1.7.0

      - name: Login to Dockerhub
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1.14.1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ needs.build-and-package-app.outputs.version }}
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a # v2.10.0
        with:
          context: .
          push: true
          build-args: NUGET_VERSION=${{ steps.gitversion.outputs.NuGetVersionV2 }}
          tags: |
            graemefoster/aicentral:${{ steps.gitversion.outputs.NuGetVersionV2 }}

      - name: Build and push latest tag
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a # v2.10.0
        with:
          context: .
          push: true
          build-args: NUGET_VERSION=${{ steps.gitversion.outputs.NuGetVersionV2 }}
          tags: |
            graemefoster/aicentral:latest
